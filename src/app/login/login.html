<div class="page-container">
  <div class="header-actions">
    <button (click)="goHome()" class="btn-back">
      ← Zurück zur Startseite
    </button>
    <h2 class="page-title">Anmelden</h2>
  </div>

  <div class="login-wrapper">
    <form class="login-form">
      <div class="form-group">
        <label for="role-select" class="form-label">Ich bin ein/e:</label>
        <select id="role-select" class="form-input select-input">
          <option value="schueler" selected>Schüler / Schülerinf</option>
          <option value="lehrer">Lehrer / Lehrerin</option>
        </select>
      </div>

      <div class="form-group">
        <label for="username" class="form-label">Benutzername oder E-Mail:</label>
        <input type="text" id="username" class="form-input" placeholder="z.B. max.mustermann">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Passwort:</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-submit">
        Login
      </button>
    </form>
  </div>
</div>
