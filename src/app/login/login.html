<div class="page-container">
  <div class="header-actions">
    <button (click)="goHome()" class="btn-back">
      ← Zurück zur Startseite
    </button>
    <h2 class="page-title">Anmelden</h2>
  </div>

  <div class="login-wrapper">
    <div class="login-form"> <div class="form-group">
      <label for="role-select" class="form-label">Ich bin ein/e:</label>
      <select #roleSelect id="role-select" class="form-input select-input">
        <option value="Schüler" selected>Schüler / Schülerin</option>
        <option value="Lehrer">Lehrer / Lehrerin</option>
      </select>
    </div>

      <div class="form-group">
        <label for="username" class="form-label">Benutzername oder E-Mail:</label>
        <input #usernameInput type="text" id="username" class="form-input" placeholder="z.B. max.mustermann" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Passwort:</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="button" (click)="handleLogin(roleSelect.value, usernameInput.value)" class="btn-submit">
        Login & Profil erstellen
      </button>
    </div>
  </div>
</div>
