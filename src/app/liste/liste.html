<div class="page-container">
  <div class="header-actions">
    <button (click)="goHome()" class="btn-back">
      ← Zurück zur Startseite
    </button>
    <h2 class="page-title">Schüler&Lehrer</h2>
  </div>

  <div class="dropdown-wrapper">
    <label for="profile-select" class="dropdown-label">Wähle ein Stundenplan-Profil:</label>

    <select (change)="onProfileSelect($event)" class="custom-select">
      <option value="">-- Bitte wählen --</option>

      <option *ngFor="let profile of profiles; trackBy: trackByProfileId" [value]="profile.id">
        {{ profile.name }}
      </option>
    </select>



    <p class="info-text">Sobald du Profile erstellst, werden sie in dieser Liste angezeigt.</p>
  </div>
</div>
<footer>
  <div class="footer-content">
    <p>&copy; 2026 BetterUntis. Alle Rechte vorbehalten.</p>
    <nav class="footer-links">
      <a routerLink="/impressum">Impressum</a>
      <a routerLink="/datenschutz">Datenschutz</a>
    </nav>
  </div>
</footer>
